services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stockwhisperer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/stockwhisperer
      SESSION_SECRET: local-dev-session-secret-change-me
      LOCAL_DEV_AUTH_BYPASS: "true"
      NODE_ENV: development
      PORT: "5000"
      # Placeholders so the OpenAI/Gemini SDK clients don't throw at startup.
      # Replace with real keys (or your own env vars) for working AI analysis.
      AI_INTEGRATIONS_OPENAI_API_KEY: ${AI_INTEGRATIONS_OPENAI_API_KEY:-placeholder-no-real-key}
      AI_INTEGRATIONS_GEMINI_API_KEY: ${AI_INTEGRATIONS_GEMINI_API_KEY:-placeholder-no-real-key}
      # Optional: enable enhanced quote fallback and analysis by exporting these
      # before running `docker compose up`, e.g. `FINNHUB_API_KEY=xxx docker compose up`.
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      TRADEFEEDS_API_KEY: ${TRADEFEEDS_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  pgdata:
